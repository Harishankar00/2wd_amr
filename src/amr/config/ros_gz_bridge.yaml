# ros_gz_bridge.yaml
# ═══════════════════════════════════════════════════════════════════
# ros_gz_bridge topic mapping — Gazebo Harmonic ↔ ROS2 Jazzy
#
# Direction conventions:
#   ROS_TO_GZ  : ROS2 publishes, Gazebo subscribes  (commands in)
#   GZ_TO_ROS  : Gazebo publishes, ROS2 subscribes  (sensors / state out)
#   BIDIRECTIONAL : both directions (e.g. TF when needed)
# ═══════════════════════════════════════════════════════════════════

# ── Velocity command: ROS → Gazebo ────────────────────────────────
- ros_topic_name: /cmd_vel
  gz_topic_name:  /cmd_vel
  ros_type_name:  geometry_msgs/msg/Twist
  gz_type_name:   gz.msgs.Twist
  direction:      ROS_TO_GZ

# ── Odometry: Gazebo → ROS ────────────────────────────────────────
- ros_topic_name: /odom
  gz_topic_name:  /odom
  ros_type_name:  nav_msgs/msg/Odometry
  gz_type_name:   gz.msgs.Odometry
  direction:      GZ_TO_ROS

# ── 2D LiDAR scan: Gazebo → ROS ──────────────────────────────────
- ros_topic_name: /scan
  gz_topic_name:  /scan
  ros_type_name:  sensor_msgs/msg/LaserScan
  gz_type_name:   gz.msgs.LaserScan
  direction:      GZ_TO_ROS

# ── TF (odom → base_link from diff drive): Gazebo → ROS ──────────
- ros_topic_name: /tf
  gz_topic_name:  /tf
  ros_type_name:  tf2_msgs/msg/TFMessage
  gz_type_name:   gz.msgs.Pose_V
  direction:      GZ_TO_ROS

# ── Simulation clock: Gazebo → ROS ───────────────────────────────
# Enables use_sim_time for all ROS2 nodes
- ros_topic_name: /clock
  gz_topic_name:  /clock
  ros_type_name:  rosgraph_msgs/msg/Clock
  gz_type_name:   gz.msgs.Clock
  direction:      GZ_TO_ROS

# ── Wheel joint states: Gazebo → ROS ─────────────────────────────
# Feeds robot_state_publisher so RViz shows correct wheel angles
- ros_topic_name: /joint_states
  gz_topic_name:  /joint_states
  ros_type_name:  sensor_msgs/msg/JointState
  gz_type_name:   gz.msgs.Model
  direction:      GZ_TO_ROS
