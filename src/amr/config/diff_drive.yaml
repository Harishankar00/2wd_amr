# diff_drive.yaml
# ═══════════════════════════════════════════════════════════════════
# Differential Drive Controller Parameters
# For Gazebo Harmonic simulation these parameters are embedded in the
# URDF xacro (gz-sim-diff-drive-system plugin).
# This file documents the values and is used as reference for real-
# robot deployment with a hardware abstraction layer.
# ═══════════════════════════════════════════════════════════════════

diff_drive:
  # ── Physical dimensions ───────────────────────────────────────
  # Must match amr.urdf.xacro values exactly
  wheel_separation: 0.32          # metres (track width, left→right)
  wheel_radius: 0.06              # metres
  wheel_diameter: 0.12            # metres (= 2 × wheel_radius)

  # ── Odometry frames ───────────────────────────────────────────
  odom_frame_id: "odom"
  base_frame_id: "base_link"
  pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
  twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]

  # ── Topics ────────────────────────────────────────────────────
  cmd_vel_topic: "/cmd_vel"
  odom_topic: "/odom"

  # ── Motion limits ─────────────────────────────────────────────
  max_linear_speed:  1.0          # m/s   (nominal 0.5 m/s)
  max_angular_speed: 2.5          # rad/s
  max_linear_accel:  0.5          # m/s²
  max_angular_accel: 1.5          # rad/s²

  # ── Encoder (real robot) ──────────────────────────────────────
  # Update with actual encoder PPR × gear_ratio
  encoder_ticks_per_rev: 4096     # example: 1024 PPR × 4 (quadrature)
  gear_ratio: 1.0                 # set if motor has gearbox

  # ── Publish settings ─────────────────────────────────────────
  publish_rate: 50                # Hz — matches simulation plugin
  use_sim_time: false             # overridden to true by launch files in sim
